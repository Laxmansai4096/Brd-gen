<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AI BRD Studio Enterprise Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --color-client: #3b82f6;
      --color-client-bg: rgba(59, 130, 246, 0.12);
      
      --color-architect: #10b981;
      --color-architect-bg: rgba(16, 185, 129, 0.12);
      
      --color-pm: #f59e0b;
      --color-pm-bg: rgba(245, 158, 11, 0.12);
      
      --color-admin: #ec4899;
      --color-admin-bg: rgba(236, 72, 153, 0.12);
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 15% 15%, rgba(59, 130, 246, 0.15) 0px, transparent 40%),
        radial-gradient(at 85% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 40%),
        radial-gradient(at 50% 85%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 520px;
      max-width: 95vw;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 36px 32px;
      position: relative;
    }

    /* Brand Header */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38bdf8;
    }

    .brand-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Role Selector */
    .role-selection-section {
      margin-bottom: 22px;
    }

    .label-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e5e7eb;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label-hint {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 500;
      text-transform: none;
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .role-btn {
      background: rgba(31, 41, 55, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      position: relative;
    }

    .role-btn:hover {
      background: rgba(31, 41, 55, 0.85);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .role-btn.active {
      background: rgba(31, 41, 55, 0.95);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 8px 20px -4px rgba(37, 99, 235, 0.35);
    }

    .role-btn.active.role-client { border-color: var(--color-client); box-shadow: 0 0 0 1px var(--color-client), 0 8px 20px -4px rgba(59, 130, 246, 0.35); }
    .role-btn.active.role-architect { border-color: var(--color-architect); box-shadow: 0 0 0 1px var(--color-architect), 0 8px 20px -4px rgba(16, 185, 129, 0.35); }
    .role-btn.active.role-pm { border-color: var(--color-pm); box-shadow: 0 0 0 1px var(--color-pm), 0 8px 20px -4px rgba(245, 158, 11, 0.35); }
    .role-btn.active.role-admin { border-color: var(--color-admin); box-shadow: 0 0 0 1px var(--color-admin), 0 8px 20px -4px rgba(236, 72, 153, 0.35); }

    .role-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-icon {
      font-size: 1.15rem;
    }

    .role-port {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .role-btn.active .role-port {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .role-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    .role-desc {
      font-size: 0.74rem;
      color: var(--text-dim);
      line-height: 1.3;
    }

    /* Form Fields */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #d1d5db;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.88rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .input-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    /* Route Telemetry Card */
    .route-telemetry {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 0.82rem;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .beacon {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    .route-port-badge {
      font-family: monospace;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Footer */
    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 540px) {
      .login-container {
        padding: 24px 20px;
      }
      .roles-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <!-- Header -->
    <div class="brand-header">
      <div class="brand-pill">
        <span class="pulse"></span>
        Enterprise Workspace Gateway
      </div>
      <h1 class="brand-title">
        <span>⚡</span> BRD Studio
      </h1>
      <p class="brand-subtitle">Select your persona role to open its dedicated localhost port.</p>
    </div>

    <!-- Step 1: Select Role -->
    <div class="role-selection-section">
      <div class="label-title">
        <span>1. Choose Persona Role</span>
        <span class="label-hint">Sets target port</span>
      </div>

      <div class="roles-grid">
        <!-- 1. Client -->
        <button type="button" class="role-btn role-client active" id="btnRoleClient" onclick="chooseRole('CLIENT')">
          <div class="role-top">
            <span class="role-icon">🧑‍💼</span>
            <span class="role-port">:8081</span>
          </div>
          <div class="role-title">Client Lead</div>
          <div class="role-desc">Ideation, requirements & dual sign-off</div>
        </button>

        <!-- 2. Architect -->
        <button type="button" class="role-btn role-architect" id="btnRoleArchitect" onclick="chooseRole('SOLUTIONS_ARCHITECT')">
          <div class="role-top">
            <span class="role-icon">🏗️</span>
            <span class="role-port">:8082</span>
          </div>
          <div class="role-title">Architect</div>
          <div class="role-desc">Cloud architecture, BoM & technical review</div>
        </button>

        <!-- 3. Project Manager -->
        <button type="button" class="role-btn role-pm" id="btnRolePM" onclick="chooseRole('PROJECT_MANAGER')">
          <div class="role-top">
            <span class="role-icon">👔</span>
            <span class="role-port">:8083</span>
          </div>
          <div class="role-title">Project Manager</div>
          <div class="role-desc">18-phase roadmap, $30/hr rates & governance</div>
        </button>

        <!-- 4. Admin -->
        <button type="button" class="role-btn role-admin" id="btnRoleAdmin" onclick="chooseRole('ADMIN')">
          <div class="role-top">
            <span class="role-icon">🛡️</span>
            <span class="role-port">:8084</span>
          </div>
          <div class="role-title">Administrator</div>
          <div class="role-desc">Calendars, rate cards & system settings</div>
        </button>
      </div>
    </div>

    <!-- Step 2: Dummy Credentials -->
    <form onsubmit="event.preventDefault(); submitLogin();">
      <div class="form-section">
        <div class="input-group">
          <label class="field-label" for="usernameInput">2. User Name / Email (Dummy)</label>
          <input type="text" class="input-box" id="usernameInput" value="Client Business Lead" placeholder="Enter any name..." required>
        </div>

        <div class="input-group">
          <label class="field-label" for="passwordInput">Password / Passcode (Dummy)</label>
          <input type="password" class="input-box" id="passwordInput" value="password123" placeholder="Enter any password...">
        </div>
      </div>

      <!-- Live Route Indicator -->
      <div class="route-telemetry">
        <div class="route-info">
          <span class="beacon"></span>
          <span>Target Workspace: <strong id="routeRoleName" style="color: #ffffff;">Client Lead</strong></span>
        </div>
        <span class="route-port-badge" id="routePortBadge">http://127.0.0.1:8081</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="submitBtnText">Sign In & Open Port 8081 ➔</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <span>🔒 Local Multi-Port Environment</span>
      <span>•</span>
      <span>⚡ Synchronized Real-Time State</span>
    </div>
  </div>

  <script>
    const ROLES = {
      CLIENT: {
        port: 8081,
        title: "Client Business Lead",
        short: "Client Lead",
        btnId: "btnRoleClient",
        defaultName: "Client Business Lead"
      },
      SOLUTIONS_ARCHITECT: {
        port: 8082,
        title: "Principal Solutions Architect",
        short: "Solutions Architect",
        btnId: "btnRoleArchitect",
        defaultName: "Solutions Architect"
      },
      PROJECT_MANAGER: {
        port: 8083,
        title: "Senior Delivery PM",
        short: "Project Manager",
        btnId: "btnRolePM",
        defaultName: "Senior Delivery PM"
      },
      ADMIN: {
        port: 8084,
        title: "System Administrator",
        short: "Administrator",
        btnId: "btnRoleAdmin",
        defaultName: "System Administrator"
      }
    };

    let activeRoleKey = "CLIENT";

    function chooseRole(roleKey) {
      activeRoleKey = roleKey;
      const role = ROLES[roleKey];

      // Update button active state
      document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(role.btnId);
      if (btn) btn.classList.add("active");

      // Auto-update username if previous was default
      const userField = document.getElementById("usernameInput");
      if (userField) {
        userField.value = role.defaultName;
      }

      // Update telemetry and button label
      document.getElementById("routeRoleName").textContent = role.short;
      document.getElementById("routePortBadge").textContent = `http://127.0.0.1:${role.port}`;
      document.getElementById("submitBtnText").textContent = `Sign In & Open Port ${role.port} ➔`;
    }

    function submitLogin() {
      const role = ROLES[activeRoleKey];
      const username = document.getElementById("usernameInput").value.trim() || role.defaultName;

      // Initials for avatar
      const words = username.split(" ");
      let avatar = "CL";
      if (words.length >= 2) {
        avatar = (words[0][0] + words[words.length - 1][0]).toUpperCase();
      } else if (words.length === 1 && words[0].length >= 2) {
        avatar = words[0].substring(0, 2).toUpperCase();
      }

      // Save user session for client app
      const userAuth = {
        username: username,
        role: activeRoleKey,
        role_title: role.title,
        avatar: avatar,
        target_port: role.port
      };
      localStorage.setItem("brd_user_auth", JSON.stringify(userAuth));

      // Visual feedback
      const btn = document.getElementById("submitBtn");
      btn.style.opacity = "0.85";
      document.getElementById("submitBtnText").textContent = `Opening Port :${role.port}...`;

      // Redirect directly to the selected role port
      const targetUrl = `http://${window.location.hostname || "127.0.0.1"}:${role.port}/?user=${encodeURIComponent(username)}&role=${activeRoleKey}&auth=1`;
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 250);
    }
  </script>
</body>

</html>
